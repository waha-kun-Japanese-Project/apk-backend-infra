syntax = "proto3";

option csharp_namespace = "Media.Grpc.Protos";

package media;

service MediaStorage {
    rpc UploadMedia(stream UploadMediaRequest)
        returns (UploadMediaRespones);
}

message UploadMediaRequest {
    oneof data {
        FileMetadata metadata = 1;
        bytes chunk = 2;
    }
}

message FileMetadata {
    string file_name = 1;
    string content_type = 2;
}

message UploadMediaRespones {
    string filepath = 1;
}