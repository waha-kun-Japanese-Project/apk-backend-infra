name: Build, Push and Deploy Backend Services
on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

env:
  DOCKERHUB_NAMESPACE: mohamedelsawyy 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: authservice
            dockerfile: AuthService/AuthService/Dockerfile
          - service: userservice
            dockerfile: UserService/UserService/Dockerfile
          - service: mediastorageservice
            dockerfile: MediaStorageService/MediaStorageService/Dockerfile
          - service: reportservice
            dockerfile: ReportService/ReportService/Dockerfile
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set image tag (short commit SHA)
        id: vars
        run: echo "image_tag=$(echo ${GITHUB_SHA} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.service }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-gitops:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: waha-kun-Japanese-Project/k8s-definitions-files
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Bump image tags for all services
        run: |
          cd gitops/backend
          TAG="${{ needs.build-and-push.outputs.image_tag }}"
          declare -A FILES=(
            [authservice]=auth-deployment.yml
            [userservice]=user-definition.yml
            [mediastorageservice]=media-storage-definition.yml
            [reportservice]=report-definition.yml
          )
          for svc in "${!FILES[@]}"; do
            f="${FILES[$svc]}"
            [ -f "$f" ] || continue
            sed -i "s|image: ${{ env.DOCKERHUB_NAMESPACE }}/${svc}:.*|image: ${{ env.DOCKERHUB_NAMESPACE }}/${svc}:${TAG}|" "$f"
          done
          grep -H "image:" *.yml

      - name: Commit and push change
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/*.yml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: deploy backend services @ ${{ needs.build-and-push.outputs.image_tag }}"
          git push